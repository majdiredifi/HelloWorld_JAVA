name: Test VM Runner

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer les dépendances (exemple Node.js / Python)
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          # Pour Python
          sudo apt update
          sudo apt install -y python3 python3-pip
          pip3 install -r requirements.txt || echo "No requirements.txt found"
          # Pour Node.js (optionnel)
          # curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          # sudo apt install -y nodejs
          # npm install

      # 3️⃣ Stage de test
      - name: Run tests
        run: |
          echo "Running tests..."
          # Commande de test fictive
          echo "Tests passed!"  

      # 4️⃣ Stage build
      - name: Build project
        run: |
          echo "Building project..."
          # Exemple Docker build
          if [ -f Dockerfile ]; then
            docker build -t my-app .
          else
            echo "No Dockerfile found, skipping build"
          fi

      # 5️⃣ Stage deploy (simulation)
      - name: Deploy project
        run: |
          echo "Deploying project..."
          # Ici tu pourrais copier les fichiers, redémarrer un service, etc.
          echo "Deployment simulated"
